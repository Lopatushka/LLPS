# Parameters for outsu.py (Otsu threshold foci segmentation).
# A copy of this file is saved into every output folder as run_config.toml.
# All keys are required; unknown keys are rejected to catch typos.

# Gaussian smoothing before thresholding, in pixels.
sigma = 0.6

# Foci mask = smoothed image > Otsu threshold * threshold_factor.
threshold_factor = 2.0

# Smallest object kept in the mask, in pixels.
min_area = 7

# How the foci mask is split into ROIs:
#   "watershed" = distance transform + watershed, splits touching foci
#   "connected" = connected regions of the mask (8-connectivity)
segmentation = "watershed"

# Minimum distance between watershed seeds (peaks of the distance transform), in pixels.
# Used only with segmentation = "watershed".
min_distance = 3

# Rolling-ball background subtraction radius, in pixels (applied before smoothing).
# 0 = no background subtraction. When > 0, the foci intensities
# (mean/max/min_intensity) are also measured on the background-subtracted image.
rolling_ball_radius = 0

# Save the figures for every image: panels/<image>_six_panels.png and
# histograms/<image>_histograms.png.
save_figures = true

# Resolution of the saved figures.
figure_dpi = 300
